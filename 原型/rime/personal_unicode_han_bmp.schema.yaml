# Optional Plane 0 Han research schema. Normal Chinese remains in Xiaohe.
schema:
  schema_id: personal_unicode_han_bmp
  name: 个人 Unicode 汉字 BMP
  version: "0.2"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  max_code_length: 4
  auto_select: true

translator:
  dictionary: personal_unicode_han_bmp
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
