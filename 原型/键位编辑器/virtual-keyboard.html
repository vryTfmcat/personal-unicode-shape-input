<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode 键盘标注</title>
<link rel="stylesheet" href="fonts/editor-fonts.css"><link rel="stylesheet" href="virtual-keyboard.css"></head>
<body>
<header><div><p class="eyebrow">UNICODE / 键位工作台</p><h1>让字符落在键上</h1><p>选择键帽，写下你的字符与键义。</p></div><a href="index.html">返回三模式编辑器 ↗</a></header>
<main>
<div class="toolbar"><label>实体键盘<select id="layout"></select></label><label>标注层<select id="layer"><option value="base">基础层</option><option value="shift">Shift 层</option></select></label><label class="check"><input id="original" type="checkbox" checked>显示原键帽</label><button id="undo" disabled>撤销</button><button id="export">导出方案</button><label class="file">导入方案<input id="import" type="file" accept=".json,application/json"></label></div>
<section class="workspace"><div class="board-panel"><div class="board-heading"><span id="boardName"></span><span id="keyCount"></span></div><div class="board-scroll"><svg id="keyboard" aria-label="可编辑键盘"></svg></div><div class="legend"><span><i class="selected-dot"></i>选中键</span><span><i class="pressed-dot"></i>实体按下</span><span id="lastKey">按实体键可查看对应位置</span></div><p class="hint">标注只改变这张键盘图。按键高亮在本页有焦点时工作；Fn、宏键等可能需要校准或无法捕获。</p></div>
<aside><p class="eyebrow">当前键帽</p><h2 id="selectedName">选择一个键</h2><p id="position"></p><label>字符或键义<textarea id="label" rows="2" placeholder="例如 Ⱝ，也可填写完整组合"></textarea></label><p id="codepoints"></p><div class="actions"><button id="apply" class="primary">应用标注</button><button id="restore">恢复原键</button></div><button id="take">取编辑器当前字符</button><p id="pickedInfo" class="hint"></p><hr><label>实体按键绑定<input id="binding" readonly placeholder="尚未绑定"></label><button id="calibrate">按实体键校准</button><p class="hint">Colemak 的 F 默认对应物理位置 KeyE。校准时按下所选键；Esc 取消。绑定独立于字符标注。</p></aside></section>
<footer><span id="status" role="status" aria-live="polite">正在载入</span><span>浏览器自动保存草稿 · 导出 JSON 保留独立文件</span></footer>
<details id="importPanel" hidden><summary>导入预览</summary><p id="importSummary"></p><button id="confirmImport" class="primary">替换当前键盘方案</button><button id="cancelImport">取消</button></details>
</main>
<script src="virtual-keyboard-layouts.js"></script><script src="virtual-keyboard-core.js"></script><script src="virtual-keyboard.js"></script>
</body></html>
