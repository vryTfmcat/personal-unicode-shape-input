<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4ef"><title>Unicode · 符号拼排</title><link rel="stylesheet" href="../fonts/editor-fonts.css"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="logo">Ⱝ</span><div><strong>符号拼排</strong><small>UNICODE WORKSPACE</small></div></div><div class="header-actions"><button id="manage">草稿／发布</button><button id="import">导入</button><button id="export">备份</button></div></header>
<main><section id="browse"><div class="section-title"><div><span class="eyebrow" id="browseEyebrow">01 / EXPLORE</span><h1 id="heading">从区块开始。</h1></div><span id="total" class="pill">正在载入字库</span></div><div class="filters"><input id="search" type="search" placeholder="搜索符号、Unicode 名称、码位或编码" aria-label="搜索符号"><select id="group" aria-label="选择字符分组"></select></div><div class="context-line"><span id="groupInfo"></span><button id="collected">只看取用盘</button></div><div id="grid" class="symbol-grid"></div><button id="more" class="wide">继续浏览</button></section>
<section id="space" hidden><div class="section-title"><div><span class="eyebrow">03 / ARRANGE</span><h1>把符号放在一起。</h1></div><span id="tileCount" class="pill">0 个元素</span></div><div class="space-tools"><div class="segmented"><button id="canvasTab" aria-pressed="true">自由空间</button><button id="keyboardTab" aria-pressed="false">实体键盘</button></div><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="try" aria-pressed="false">试输</button></div>
<div id="canvasPanel"><div class="canvas-bar"><span id="position">512 × 512 格</span><div><button id="minus" aria-label="缩小">−</button><button id="home">居中</button><button id="plus" aria-label="放大">＋</button></div></div><div id="viewport" aria-label="可平移缩放的键位空间"><div id="tiles"></div><div class="canvas-caption">自由键位空间 <span>512 × 512</span></div></div><div class="hint">拖动空白平移 · 双指缩放 · 拖动元素换位<br>取用符号后点空格放置；选中已有元素后点空格移动。</div></div>
<div id="keyboardPanel" hidden><select id="keyboardLayout" aria-label="键盘外形"><option value="mk68">MK68 · Colemak</option><option value="razer">Razer · ISO</option></select><div id="keyboardScroll"><svg id="keyboard" role="group" aria-label="虚拟实体键盘"></svg></div><div class="hint">先取用符号，再点键帽标注。可横向滚动查看整个键盘。</div></div>
<div class="selection-bar"><span id="selectionText">选择符号，再点空格放置</span><button id="cancelSelection">取消选择</button><button id="remove" disabled>移除元素</button></div><label id="outputLabel">试输文本<textarea id="output" placeholder="开启试输，再点空间元素或键帽" rows="2"></textarea></label><button id="copyOutput">复制文本</button></section></main>
<aside id="tray"><div class="tray-heading"><strong>取用盘 <span id="trayCount">0</span></strong><span id="trayHelp">点符号查看与取用</span></div><div id="trayItems"></div></aside>
<nav aria-label="工作区"><button data-mode="block" class="active"><span>▦</span>区块</button><button data-mode="shape"><span>◯</span>全形</button><button data-mode="personal"><span>☆</span>收藏</button><button data-mode="space"><span>⌘</span>键位空间</button></nav>
<dialog id="detail"><div class="dialog-top"><span class="eyebrow">SYMBOL / 元素</span><button id="closeDetail" aria-label="关闭详情">×</button></div><div id="detailGlyph" class="glyph"></div><h2 id="detailName"></h2><p id="detailMeta"></p><p id="detailCodes"></p><button id="take" class="primary wide">取用到键位空间</button><button id="copyChar" class="wide">复制符号</button></dialog>
<dialog id="importDialog"><h2>导入布局预览</h2><p id="importSummary"></p><p>确认后替换当前拼排布局；可以撤销。取用盘保持不变。</p><button id="confirmImport" class="primary">替换布局</button><button id="cancelImport">取消</button></dialog>
<input id="file" type="file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div><div id="saveState" role="status">正在载入…</div>
<script src="../virtual-keyboard-core.js"></script><script src="../virtual-keyboard-layouts.js"></script><script src="core.js"></script><script src="workspace-core.js"></script><script src="app.js"></script><script src="workspace-ui.js"></script></body></html>
