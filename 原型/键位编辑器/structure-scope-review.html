$('cards').innerHTML=DATA.humanQuestions.map(q=>`<article class="card" id="question-${q.id}"><h2>${q.id} · ${esc(q.title)}</h2><div class="samples">${q.records.map(r=>{const p=r.preview;return `<div class="sample"><div class="frame"><span class="glyph" role="img" aria-label="${esc(r.char)}锁定原字形" style="background-image:url('${esc(p.url)}');background-position:-${p.x}px -${p.y}px"></span></div><strong>${esc(r.char)} U+${r.cp.toString(16).toUpperCase()}</strong></div>`}).join('')}</div><p><strong>已核对：</strong>${esc(q.fact)}</p><p class="proposal"><strong>建议，未实施：</strong>${esc(q.recommendation)}</p><p><strong>请判断：</strong>${esc(q.question)}</p>${q.options.map((x,i)=>`<label><input type="radio" name="${q.id}" value="${i}">${esc(x)}</label>`).join('')}<label>补充或逐字修改（可留空）<textarea data-note="${q.id}" aria-label="${q.id}补充说明"></textarea></label><details><summary>程序证据与全部原查法（无需逐项审核）</summary><pre>${esc(JSON.stringify(q.records.map(({preview,...rest})=>rest),null,2))}</pre></details></article>`).join('');
for(const q of DATA.humanQuestions){const a=draft[q.id]||{};if(Number.isInteger(a.choice)&&q.options[a.choice])document.querySelector(`input[name="${q.id}"][value="${a.choice}"]`).checked=true;document.querySelector(`[data-note="${q.id}"]`).value=a.note||''}
function save(){for(const q of DATA.humanQuestions){const selected=document.querySelector(`input[name="${q.id}"]:checked`);draft[q.id]={choice:selected?Number(selected.value):null,note:document.querySelector(`[data-note="${q.id}"]`).value}}try{localStorage.setItem(storageKey,JSON.stringify(draft));$('status').textContent='本机草稿已保存；尚未写入人工确认或当前键位。'}catch{$('status').textContent='浏览器未能保存草稿，请整理并复制答复。'}}
$('cards').addEventListener('change',save);$('cards').addEventListener('input',save);
function compose(){save();$('result').value='整字范围首批审核（仅限本页7字）\n'+DATA.humanQuestions.map(q=>{const a=draft[q.id];return q.id+'：'+(a.choice===null?'暂不判断':q.options[a.choice])+(a.note?'；补充：'+a.note:'')}).join('\n');return $('result').value}
$('compose').onclick=compose;$('copy').onclick=async()=>{const t=compose();try{await navigator.clipboard.writeText(t);$('status').textContent='已复制。请发回当前对话；候选尚未修改。'}catch{$('result').focus();$('result').select();$('status').textContent='请手动复制文本框内容并发回当前对话。'}};
</script></html>
<script>if(DATA.acceptance){document.querySelectorAll("main > p")[0].innerHTML="本批4题、7字的审核已确认，结果见上方。下方保留原问题供追溯。";document.querySelectorAll("#cards input,#cards textarea,#compose,#copy").forEach(n=>n.disabled=true);document.getElementById("status").textContent="此批已确认，原问题与草稿仅供追溯；如需修订请在对话说明。";}</script>
