<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Unicode 音型键位编辑器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">༳</span>
      <div>
        <h1>Unicode 音型键位编辑器</h1>
        <p>拖动分区 · 微调形符 · 本地保存</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="saveStatus" class="save-status">本地草稿</span>
      <button id="exportTsvButton" class="button quiet" type="button">导出 TSV</button>
      <button id="exportButton" class="button quiet" type="button">导出 JSON</button>
      <label class="button quiet file-button">导入 JSON<input id="importInput" type="file" accept="application/json,.json"></label>
      <button id="resetButton" class="button danger" type="button">重置</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <span>字符页面</span>
        <small>拖到页面名即可移动</small>
      </div>
      <label class="page-filter"><span aria-hidden="true">⌕</span><input id="pageSearchInput" type="search" placeholder="搜索前缀或区块"></label>
      <nav id="pageNav" class="page-nav" aria-label="字符页面"></nav>
      <div class="sidebar-note">
        <strong>常用字符是收藏层</strong>
        <p>拖入常用页不会改变原来的前两码；拖入其他页会换成目标页前缀，并保留后两码。</p>
      </div>
    </aside>

    <section class="content">
      <div class="page-intro">
        <div class="page-title-row">
          <div>
            <div class="eyebrow"><span id="prefixBadge"></span><span id="pageCount"></span></div>
            <h2 id="pageTitle"></h2>
            <p id="pageDescription"></p>
          </div>
          <label class="block-field">存储区块 / 类别
            <input id="blockInput" type="text" autocomplete="off">
          </label>
        </div>
        <details id="rulesPanel" class="rules-panel">
          <summary><span>本页形符规则</span><small>每个前两键可拥有独立规则；修改只影响规则说明，不批量重编码。</small></summary>
          <div class="rule-columns">
            <section><h3>第三键 · 主骨架</h3><div id="mainRules" class="rule-grid"></div></section>
            <section><h3>第四键 · 状态</h3><div id="stateRules" class="rule-grid"></div></section>
          </div>
        </details>
      </div>

      <div class="toolbar">
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索字符、码、U+码位或名称"></label>
        <label class="check-control"><input id="conflictOnly" type="checkbox">只看同码</label>
        <span id="conflictSummary" class="conflict-summary"></span>
      </div>

      <div id="glyphGrid" class="glyph-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>
        <span>∅</span><p>这一页暂时没有符合条件的字符。</p>
      </div>
    </section>

    <aside id="inspector" class="inspector">
      <div id="inspectorEmpty" class="inspector-empty">
        <span>◌</span><p>点选一个字符，在这里微调键位。</p>
      </div>
      <div id="inspectorBody" hidden>
        <div class="inspector-head">
          <div id="inspectorGlyph" class="inspector-glyph"></div>
          <div><h2 id="inspectorCodepoint"></h2><p id="inspectorName"></p></div>
        </div>
        <div class="copy-row">
          <button id="copyGlyphButton" class="button primary" type="button">复制字符</button>
          <label class="favorite-control"><input id="favoriteInput" type="checkbox">常用收藏</label>
        </div>
        <label class="form-field">四码
          <input id="codeInput" type="text" maxlength="4" spellcheck="false" autocomplete="off">
          <small id="codeHint"></small>
        </label>
        <label class="form-field">归属页面
          <select id="pageSelect"></select>
        </label>
        <div class="key-pair">
          <label class="form-field">第三键 · 主骨架<select id="mainKeySelect"></select></label>
          <label class="form-field">第四键 · 状态<select id="stateKeySelect"></select></label>
        </div>
        <label class="form-field">备注
          <textarea id="noteInput" rows="4"></textarea>
        </label>
        <dl class="metadata">
          <div><dt>来源区块</dt><dd id="sourceBlock"></dd></div>
          <div><dt>当前同码</dt><dd id="sameCodeCount"></dd></div>
        </dl>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
