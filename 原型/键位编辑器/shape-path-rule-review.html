bel></fieldset></div><div class="step"><div class="step-title"><span class="step-num">3</span><h3>保存本字判断</h3></div><fieldset><legend>整体规则是否合适？</legend>${choices('verdict',['合适','需要修改','不合适','暂不能判断'],a.verdict)}</fieldset><label>修改建议或备用路径（选填）<textarea id="note" rows="3" style="margin-top:7px" placeholder="例如：先认双环，再选孔形；下孔位置放在后面"></textarea></label><p id="save-status" class="status muted" role="status">${a.completed?'本字已标完成，可继续修改。':'所有判断默认空白；选择后再标记完成。'}</p><button id="complete" class="primary">保存本字判断，下一字</button><details id="codes-hint"><summary>现有码与实际试查（选填）</summary><p class="muted">以下是生成页面时的现有码快照，不表示它们的全部语义都已通过。数字为快照候选数，点击码可做实时查询。只支持规范前置 ABCD；三码必须是真实注册码。查询不会改变本字的规则判断。</p><div class="code-list">${r.paths.map(p=>`<button type="button" data-code="${esc(p.code)}" title="${p.compatibilityOnly?'旧码兼容；':''}${p.preferred?'当前首选；':''}快照${p.count}候选"><code>${esc(p.code)}</code> ${p.count}${p.compatibilityOnly?' · 兼容':''}${p.preferred?' · 原首选':''}</button>`).join('')||'当前无细码，仍可评价语义。'}</div><div class="querybar"><input id="query-code" type="text" maxlength="4" placeholder="规范码 ABCD" aria-label="规范前置查询码"><button id="query-btn">查询现有码</button></div><p id="query-status" class="status" role="status"></p><div id="candidates" class="candidates"></div><button id="query-more" hidden>下一批候选</button><p class="muted">试查目标是本字；点选其它字会记为一次误点。候选可达不等于路径自然。</p></details></div></div><footer class="footer"><button id="prev" ${current===0?'disabled':''}>上一字</button><div class="buttons"><button id="skip">${current===DATA.records.length-1?'查看汇总':'跳过 / 下一字'}</button></div></footer></article>`;
 $('#first-thought').value=a.firstThought||'';$('#first-thought').oninput=e=>{a.firstThought=e.target.value;changed(r)};
 $('#reveal').onclick=()=>{a.reviewOpened=true;$('#review-area').hidden=false;$('#reveal').hidden=true;save()};$('#reveal').hidden=!!(a.reviewOpened||a.completed);
 for(const s of document.querySelectorAll('[data-route-judge]')){s.value=a.routeJudgments?.[s.dataset.routeJudge]||'';s.onchange=()=>{a.routeJudgments[s.dataset.routeJudge]=s.value;changed(r)}}
 $('#primary-choice').value=a.primary||'';$('#primary-choice').onchange=e=>{a.primary=e.target.value;changed(r)};
 $('#detail-other').value=a.detailOther||'';$('#detail-other').oninput=e=>{a.detailOther=e.target.value;changed(r)};
 $('#note').value=a.note||'';$('#note').oninput=e=>{a.note=e.target.value;changed(r)};
 document.querySelectorAll('input[name=detail]').forEach(e=>e.onchange=()=>{a.detailChoice=e.value;changed(r)});
 document.querySelectorAll('input[name=verdict]').forEach(e=>e.onchange=()=>{a.verdict=e.value;changed(r)});
 $('#complete').onclick=()=>{let msg='';if(!a.verdict)msg='请先判断整体规则是否合适；不能确定可选“暂不能判断”。';else if(['合适','需要修改'].includes(a.verdict)&&!a.primary)msg='请选择主要路径；也可以选择“暂不能确定主要路径”。';else if(a.primary==='custom'&&!a.note.trim())msg='你选择了另一种思路，请在修改建议里写出它。';if(msg){$('#save-status').className='status error';$('#save-status').textContent=msg;return}a.completed=true;a.completedAt=new Date().toISOString();save();if(current<DATA.records.length-1)go(current+1);else renderSummary()};
 $('#prev').onclick=()=>go(current-1);$('#skip').onclick=()=>current<DATA.records.length-1?go(current+1):renderSummary();
 $('#codes-hint').ontoggle=()=>{if($('#codes-hint').open){a.hintSeen=true;save()}};
 let queryCode='',offset=0,attempt=null;
 async function query(more=false){const code=more?queryCode:$('#query-code').value.trim().toLowerCase();if(!/^[a-z]{1,4}$/.test(code)){$('#query-status').textContent='请输入1—4个英文字母规范前置码。';return}controller?.abort();controller=new AbortController();const token=++queryToken;if(!more){queryCode=code;offset=0;attempt={code,startedAt:new Date().toISOString(),hintSeen:true,found:false};a.attempts.push(attempt)}$('#query-status').textContent='正在读取当前候选…';$('#query-more').hidden=true;save();try{const resp=await fetch('/api/shape-overview/query?allocation=1&prefix='+encodeURIComponent(code)+'&offset='+offset,{signal:controller.signal});if(!resp.ok)throw Error('HTTP '+resp.status);const q=await resp.json();if(token!==queryToken)return;attempt.total=q.total;$('#query-status').textContent=q.total?`${code} · 当前${q.total}候选 · 第${offset+1}—${Math.min(offset+q.rows.length,q.total)}位`:`${code} 当前没有候选。这不是已分配的新语义码。`;$('#candidates').replaceChildren();for(const [i,row] of q.rows.entries()){const b=document.createElement('button');b.className='candidate';const span=document.createElement('span');span.className='sprite';span.setAttribute('role','img');span.setAttribute('aria-label',row.char);if(row.preview){span.style.backgroundImage=`url("/${row.preview.url}")`;span.style.backgroundPosition=`-${row.preview.x}px -${row.preview.y}px`}else span.textContent=row.char;const label=document.createElement('span');label.textContent='U+'+row.cp.toString(16).toUpperCase();b.append(span,label);b.onclick=()=>{if(row.cp===r.cp){attempt.found=true;attempt.rank=offset+i+1;b.classList.add('target');$('#query-status').textContent=`已找到 ${r.char}：${code}，${q.total}候选，第${attempt.rank}位。`}else{attempt.misclicks=(attempt.misclicks||0)+1;$('#query-status').textContent='点选的不是本字，可继续查找。'}save()};$('#candidates').append(b)}$('#query-more').hidden=offset+q.rows.length>=q.total;save()}catch(e){if(e.name==='AbortError')return;if(token!==queryToken)return;attempt.error=String(e);$('#query-status').textContent='当前服务查询失败；仍可继续规则判断。'+e.message;save()}}
 $('#query-btn').onclick=()=>query();$('#query-code').onkeydown=e=>{if(e.key==='Enter')query()};$('#query-more').onclick=()=>{offset+=60;query(true)};
 document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{$('#query-code').value=b.dataset.code;query()});updateProgress();
}
function renderSummary(){queryToken++;controller?.abort();showSummary=true;$('#main').innerHTML=`<section class="panel"><span class="tag">审核汇总</span><h2>已完成 ${DATA.records.filter(r=>answer(r).completed).length} / ${DATA.records.length}</h2><p class="muted">可以只交回部分结果。“暂不能判断”也是有效答复。草稿不会直接改码、首选或人工审议。</p><div>${DATA.records.map((r,i)=>{const a=answer(r),main=r.routes.find(t=>t.id===a.primary)?.title||({custom:'另有思路',undecided:'主路径待定'}[a.primary]||'尚未选主要路径');return `<div class="summary-row"><span class="symbol">${esc(r.char)}</span><div class="info"><strong>${esc(a.completed?a.verdict:'尚未完成')}</strong><div class="muted">${esc(main)}</div></div><button data-review-index="${i}">查看</button></div>`}).join('')}</div><div class="toolbar"><button class="primary" id="summary-copy">复制结果</button><button id="summary-download">下载JSON</button></div></section>`;document.querySelectorAll('[data-review-index]').forEach(b=>b.onclick=()=>go(Number(b.dataset.reviewIndex)));$('#summary-copy').onclick=copyResults;$('#summary-download').onclick=download;save();window.scrollTo({top:0,behavior:'instant'})}
function resultObject(){return {schema:TYPE,datasetSHA256:DATA.datasetSHA256,createdAt:DATA.createdAt,exportedAt:new Date().toISOString(),status:'用户逐字判断草稿；待对话核实，不直接作为规则接受或新编码',completed:DATA.records.filter(r=>answer(r).completed).length,current,records:DATA.records.map(r=>({id:r.id,char:r.char,cp:r.cp,topic:r.topic,routes:r.routes,question:r.question,...clone(answer(r))}))}}
function resultText(){return JSON.stringify(resultObject(),null,2)}
async function copyResults(){try{await navigator.clipboard.writeText(resultText());$('#global-status').textContent='已复制结果，可以粘贴回对话。';$('#export-text').hidden=true}catch{$('#export-text').hidden=false;$('#export-text').value=resultText();$('#export-text').focus();$('#export-text').select();$('#global-status').textContent='自动复制不可用；可手动复制展开的结果，或下载JSON。'}$('#global-status').className='good'}
function download(){save();const url=URL.createObjectURL(new Blob([resultText()],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='逐字路径规则判断-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#global-status').textContent='已发起JSON下载；请在浏览器下载记录中确认文件。';$('#global-status').className='good'}
function validateImport(x){if(!x||x.schema!==TYPE||x.datasetSHA256!==DATA.datasetSHA256||!Array.isArray(x.records))throw Error('草稿版本或符号基线不同，请使用同一页面导出的JSON。');const clean={};for(const r of x.records){const source=DATA.records.find(s=>s.id===r.id&&s.cp===r.cp);if(!source)throw Error('草稿包含本页之外的字符。');const getText=k=>typeof r[k]==='string'?r[k]:'';const knownIds=new Set(source.routes.map(t=>t.id));if(r.primary&&!knownIds.has(r.primary)&&!['custom','undecided'].includes(r.primary))throw Error('主要路径编号不匹配。');if(r.verdict&&!['合适','需要修改','不合适','暂不能判断'].includes(r.verdict))throw Error('整体判断值不匹配。');const routeJudgments={};for(const [key,val] of Object.entries(r.routeJudgments||{})){if(!knownIds.has(key)||!['','合适','需调整','不合适','重复，可收起推荐','暂不能判断'].includes(val))throw Error('路径判断值不匹配。');routeJudgments[key]=val}clean[source.id]={firstThought:getText('firstThought'),primary:getText('primary'),detailChoice:getText('detailChoice'),detailOther:getText('detailOther'),routeJudgments,verdict:getText('verdict'),note:getText('note'),hintSeen:!!r.hintSeen,reviewOpened:!!r.reviewOpened,attempts:Array.isArray(r.attempts)?r.attempts:[],completed:!!r.completed,updatedAt:getText('updatedAt'),completedAt:getText('completedAt')}}return clean}
$('#copy-btn').onclick=copyResults;$('#download-btn').onclick=download;$('#summary-btn').onclick=renderSummary;$('#toggle-nav').onclick=()=>$('#nav').classList.toggle('show');$('#import-btn').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2*1024*1024)throw Error('文件超过2MB，请选择本页导出的判断JSON。');const data=JSON.parse(await f.text()),clean=validateImport(data);if(Object.keys(store.answers).some(k=>store.answers[k].completed||store.answers[k].firstThought||store.answers[k].note||store.answers[k].verdict)){if(!confirm('导入将按字符替换本页同字草稿。建议先下载当前结果。继续导入？'))return}store.answers={...store.answers,...clean};current=Math.max(0,Math.min(DATA.records.length-1,Number(data.current)||0));showSummary=false;save();render();$('#global-status').textContent='草稿已导入。';$('#global-status').className='good'}catch(err){$('#global-status').textContent='未导入：'+err.message;$('#global-status').className='error'}finally{e.target.value=''}};
buildNav();render();if(storageWarning){$('#global-status').textContent=storageWarning;$('#global-status').className='storage-error'}
</script><script src="/path-review-received.js"></script></body></html>
