<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12字实际查找测试</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#203241;font:16px/1.7 system-ui}main{max-width:1050px;margin:auto;padding:20px}section{background:white;border:1px solid #ccd6df;padding:18px;margin:18px 0;border-radius:10px}button,input,select,textarea{font:inherit;padding:7px;max-width:100%}button{cursor:pointer}label{display:block;margin:10px 0}textarea{width:100%}h1{font-size:26px}h2{font-size:21px}code{background:#edf2f6;padding:2px 5px}.target{width:96px;height:96px;image-rendering:auto}.grid{display:flex;gap:7px;flex-wrap:wrap}.candidate{display:flex;flex-direction:column;width:88px;align-items:center;background:#fafcfd;border:1px solid #bdccd7}.sprite{display:block;width:64px;height:64px;background-repeat:no-repeat}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#146c9c}.notice{border-left:5px solid #147e9b}details{margin-top:16px}small{color:#506370}.query{width:160px}.result{min-height:30px} .ok{background:#e4f4ec;padding:8px}@media(max-width:500px){main{padding:10px}section{padding:12px}}</style>
<main><h1>12字实际查找测试</h1><a href="shape-key-overview.html">四位键位总览</a>
<section class="notice"><strong>先试查，再看答案。不是再次审批既有规则。</strong><p>看原字形，输入自己首先想到的1—4位码，在返回候选中点击目标字。可重复尝试；ộ请分别尝试下方点块和上方折线两条思路。然后记录自然程度和卡点。</p><p>候选来自当前工作总览，尚未部署到输入法。机器已验证路径可达；“是否自然”仍等待你的体验。计时含停顿，不单独据此评价。</p><p>草稿只在当前浏览器保存，不写入人工审议。查看答案后的试查会标记“已看提示”。完成后复制结果回对话；也可以下载JSON留存。</p><button id="copy">复制试查结果</button> <button id="download">下载结果JSON</button><p id="exportStatus"></p></section><div id="cards"></div></main>
<script>
const DATA=__DATA__, KEY='unicode-lookup-v5-20261025-v1';let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{saved={}}
const drafts=saved.drafts||{},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify({baseline:DATA.baseline,drafts}))}
function state(cp){return drafts[cp]||(drafts[cp]={attempts:[],natural:'',preference:'',note:'',hint:false})}
for(const r of DATA.records){const s=state(r.cp),section=document.createElement('section');section.dataset.cp=r.cp;section.innerHTML=`<h2>${esc(r.char)} · U+${r.cp.toString(16).toUpperCase()}</h2><img class="target" src="${r.image||''}" alt="${esc(r.char)}锁定原字形"><p>先按你自己的理解查找；测试范围和已有路径在下方提示中。</p><input class="query" aria-label="${esc(r.char)}试查编码" maxlength="4" placeholder="输入1—4位码"> <button class="search">查询</button><p class="result"></p><div class="grid"></div><button class="more" hidden>下一批候选</button><p class="history"></p><label>选键是否自然 <select class="natural"><option value="">尚未评价</option><option>自然，能直接想到</option><option>需要回忆键义</option><option>难以选择对象或键位</option><option>没有找到</option></select></label><label>查法偏好 <select class="preference"><option value="">尚未评价</option><option>更愿意用新查法</option><option>更愿意用旧查法</option><option>两种都保留</option><option>暂不能判断</option></select></label><label>卡点或补充<textarea class="note" rows="2" placeholder="例如：第一位不确定／主体与附件难选／候选太多"></textarea></label><details class="hints"><summary>查看范围提示与当前查法（会标记后续试查已看提示）</summary><p>${esc(r.topic)}：${esc(r.note)}</p><p>下列候选数是本批基线；实际查询显示当前人数。路径可达不等于语义已逐字确认。</p>${r.paths.map(p=>`<p><code>${esc(p.code)}</code> ${p.count}候选 · ${esc(p.kind)}${p.preferred?' · 原首选':''}${p.compatibilityOnly?' · 旧码兼容':''}</p>`).join('')}</details>`;document.querySelector('#cards').append(section);
 let current=null,offset=0,token=0;const $=q=>section.querySelector(q);
 function history(){$('.history').textContent=s.attempts.length?`${s.attempts.length}次查询；已找到${s.attempts.filter(a=>a.found).length}次。`:'尚未试查'}history();
 for(const k of ['natural','preference','note']){$('.'+k).value=s[k]||'';$('.'+k).addEventListener('input',()=>{s[k]=$('.'+k).value;persist()})}
 $('.hints').addEventListener('toggle',()=>{if($('.hints').open){s.hint=true;persist()}});
 async function query(more=false){const code=$('.query').value.trim().toLowerCase();if(!/^[a-z]{1,4}$/.test(code)){$('.result').textContent='请输入1—4个英文字母。';return}const id=++token;if(!more){offset=0;current={code,startedAt:new Date().toISOString(),start:performance.now(),hint:s.hint,found:false};s.attempts.push(current);persist()}$('.result').textContent='查询中…';try{const resp=await fetch('/api/shape-overview/query?allocation=1&prefix='+code+'&offset='+offset);if(!resp.ok)throw Error(resp.status);const q=await resp.json();if(id!==token)return;current.total=q.total;current.code=code;$('.result').textContent=`${code} · ${q.total}个候选 · 当前${offset+1}—${Math.min(offset+q.rows.length,q.total)}（0个时无候选）`;$('.grid').replaceChildren();for(const row of q.rows){const b=document.createElement('button');b.className='candidate';const p=row.preview,span=document.createElement('span');span.className='sprite';span.setAttribute('role','img');span.setAttribute('aria-label',row.char);if(p){span.style.backgroundImage=`url("${p.url}")`;span.style.backgroundPosition=`-${p.x}px -${p.y}px`}else span.textContent=row.char;b.append(span);const small=document.createElement('small');small.textContent='U+'+row.cp.toString(16).toUpperCase();b.append(small);b.addEventListener('click',()=>{if(row.cp!==r.cp){$('.result').textContent='这不是目标字，可继续查找。';current.misclicks=(current.misclicks||0)+1;persist();return}current.found=true;current.seconds=Number(((performance.now()-current.start)/1000).toFixed(1));current.rank=offset+q.rows.indexOf(row)+1;$('.result').textContent=`已找到：${code}，${q.total}候选，第${current.rank}位，${current.seconds}秒${current.hint?'（已看提示）':''}`;$('.result').classList.add('ok');persist();history()});$('.grid').append(b)}$('.more').hidden=offset+q.rows.length>=q.total;persist();history()}catch(e){$('.result').textContent='查询失败：'+e.message;current.error=String(e);persist()}}
 $('.search').addEventListener('click',()=>{$('.result').classList.remove('ok');query()});$('.query').addEventListener('keydown',e=>{if(e.key==='Enter')query()});$('.more').addEventListener('click',()=>{offset+=60;query(true)});
}
function result(){return JSON.stringify({test:'12字实际查找-v1',baseline:DATA.baseline,exportedAt:new Date().toISOString(),status:'用户试查草稿；未经对话核实，不作为规则接受',records:DATA.records.map(r=>({char:r.char,cp:r.cp,...state(r.cp)}))},null,2)}
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result());document.querySelector('#exportStatus').textContent='已复制，请粘贴回对话。'}catch{document.querySelector('#exportStatus').textContent='复制不可用，请下载JSON。'}};
document.querySelector('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([result()],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='12字实际查找结果.json';a.click();URL.revokeObjectURL(u)};
</script></html>
