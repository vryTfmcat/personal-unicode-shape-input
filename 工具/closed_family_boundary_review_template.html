<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>k与闭合形族 · 规则边界审核</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;margin:20px;background:#f5f6f8;color:#20323c}main{max-width:1100px;margin:auto}h1{font-size:25px}h2{font-size:20px}a{color:#17667d}.card{background:white;border:1px solid #ccd4da;border-radius:8px;padding:16px;margin:18px 0;overflow-wrap:anywhere}.samples{display:flex;gap:10px;flex-wrap:wrap}.sample{width:100px;padding:8px;background:#f4f7f8}.glyph{display:block;width:64px;height:64px;background-repeat:no-repeat;margin:auto}.proposal{border-left:4px solid #4e8a88;padding-left:12px}label{display:block;padding:9px;border:1px solid #d5dde1;margin:8px 0;cursor:pointer}input{margin-right:8px}textarea,button{font:inherit}textarea{width:100%;min-height:70px;padding:8px}button{padding:9px;border:1px solid #9ab0ba;border-radius:4px;background:white;cursor:pointer}small{display:block;color:#536a77}summary{cursor:pointer;color:#246b80}#result{min-height:140px}@media(max-width:400px){body{margin:10px}.card{padding:12px}}</style><main><a href="shape-key-overview.html#round=1">返回四位键位总览</a><h1>k与其它闭合形族：规则边界审核</h1><p><strong>只需审核K1、K2两题。</strong>下方先展示锁定字体原字形与现行归属，再列尚未实施的建议。</p><p>本次判断规则关系，不批量确认成员；旧码、首选、v4候选及首批7字确认保持不变。主要查法与可靠备选可以并存，不要求每字只能属于一个形族。</p><nav><a href="#K1">跳到K1：k与专门形族</a> · <a href="#K2">跳到K2：b／p／k分工</a></nav><section class="card"><h2>代表字与边界</h2><div id="examples"></div></section><div id="questions"></div><section class="card"><h2>整理审核答复</h2><p>选项默认留空。选择仅存本机草稿，复制答复发回当前对话后才进入既有人工审议；网页不会更新当前规则。</p><button id="compose">整理答复</button> <button id="copy">复制答复</button><p id="status" role="status"></p><textarea id="result" readonly aria-label="审核答复"></textarea></section></main><script>
const DATA=__DATA__,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('examples').innerHTML=DATA.groups.map(g=>`<details open><summary><strong>${g.key==='negative'?'反例':g.key+' · '+esc(g.label)}</strong></summary><div class="samples">${g.records.map(r=>{const p=r.preview;return `<div class="sample"><span class="glyph" role="img" aria-label="${esc(r.char)}原字形" style="background-image:url('${esc(p.url)}');background-position:-${p.x}px -${p.y}px"></span><strong>${esc(r.char)}</strong><small>U+${r.cp.toString(16).toUpperCase()}</small><small>当前：${esc(r.familyKey||'待定')}</small></div>`}).join('')}</div><p>已查当前状态：${esc(g.current)}</p><p class="proposal">${DATA.acceptance?'已接受边界，成员应用仍须核验':'建议边界，未实施'}：${esc(DATA.acceptance?.definitions[g.key]?.condition||g.proposal)}</p></details>`).join('');
$('questions').innerHTML=DATA.questions.map(q=>`<article class="card" id="${q.id}"><h2>${q.id} · ${esc(q.title)}</h2><p>${esc(q.issue)}</p><p class="proposal"><strong>${DATA.acceptance?'原审核建议，已接受':'建议，尚待审核'}：</strong>${esc(q.recommendation.replace('此一般边界尚待本次审核。',DATA.acceptance?'此一般边界已接受；逐字应用仍须核验。':'此一般边界尚待本次审核。'))}</p>${q.options.map((o,i)=>`<label><input type="radio" name="${q.id}" value="${i}">${esc(o)}</label>`).join('')}<label>补充说明<textarea data-note="${q.id}" aria-label="${q.id}补充"></textarea></label></article>`).join('');
const key='unicode-closed-family-policy-draft-20261025-'+DATA.activeVersion;let draft={};try{draft=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
for(const q of DATA.questions){const d=draft[q.id]||{};if(Number.isInteger(d.choice)&&q.options[d.choice])document.querySelector(`input[name="${q.id}"][value="${d.choice}"]`).checked=true;document.querySelector(`[data-note="${q.id}"]`).value=d.note||''}
if(DATA.acceptance){
 document.querySelector('h1').textContent='k与其它闭合形族：已确认规则边界';
 document.querySelector('main > p').innerHTML='K1、K2两题已确认。当前成员、旧码和首选保持不变；下面保留代表字和原审核题作为依据。';
 const state=document.createElement('section');state.className='card';state.id='acceptedPolicyState';state.innerHTML='<h2>已收到并记录确认</h2><p>'+esc(DATA.acceptance.userResponseRaw)+'</p><p>'+esc(DATA.acceptance.scope)+'</p>';
 document.querySelector('h1').after(state);
 for(const q of DATA.questions){document.querySelector(`input[name="${q.id}"][value="${DATA.acceptance.decisions[q.id]}"]`).checked=true;}
 document.querySelectorAll('#questions input,#questions textarea,#compose,#copy').forEach(n=>n.disabled=true);
 $('status').textContent='本次规则已确认，表单仅供追溯；浏览器草稿不能覆盖确认结果。';
}
function save(){for(const q of DATA.questions){const r=document.querySelector(`input[name="${q.id}"]:checked`);draft[q.id]={choice:r?Number(r.value):null,note:document.querySelector(`[data-note="${q.id}"]`).value}}try{localStorage.setItem(key,JSON.stringify(draft));$('status').textContent='本机草稿已保存；没有改动现行规则。'}catch{$('status').textContent='无法保存本机草稿，请整理后复制。'}}
$('questions').addEventListener('change',save);$('questions').addEventListener('input',save);function compose(){save();$('result').value='闭合形族边界审核（规则建议，不自动批量迁移）\n'+DATA.questions.map(q=>{const d=draft[q.id];return q.id+'：'+(d.choice===null?'暂不判断':q.options[d.choice])+(d.note?'；补充：'+d.note:'')}).join('\n');return $('result').value}$('compose').onclick=compose;$('copy').onclick=async()=>{const t=compose();try{await navigator.clipboard.writeText(t);$('status').textContent='已复制，请发回当前对话。'}catch{$('result').focus();$('result').select();$('status').textContent='请手动复制文本框内容。'}};
</script></html>
