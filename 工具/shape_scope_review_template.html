<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整字与局部对象 · 首批人工审阅</title><style>
*{box-sizing:border-box}body{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:#f4f6f8;color:#20313b;margin:20px}main{max-width:1080px;margin:auto}h1{font-size:25px}h2{font-size:20px}a{color:#126b80}.card{background:white;border:1px solid #bdc9d0;border-radius:8px;padding:18px;margin:20px 0;overflow-wrap:anywhere}.samples{display:flex;gap:14px;flex-wrap:wrap}.sample{width:140px;background:#f7f9fa;border:1px solid #d5dce1;padding:10px}.frame{width:112px;height:112px;overflow:hidden;background:white}.glyph{display:block;width:64px;height:64px;background-repeat:no-repeat;transform:scale(1.75);transform-origin:top left}label{display:block;padding:9px;border:1px solid #d4dce0;margin:7px 0;border-radius:4px;cursor:pointer}input{margin-right:8px}textarea,button{font:inherit}textarea{width:100%;min-height:80px;padding:8px}button{padding:10px;background:white;border:1px solid #90a6af;border-radius:4px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:380px;overflow:auto}.proposal{border-left:4px solid #568f91;padding-left:10px}#result{min-height:180px}small{display:block;color:#526976}details{margin-top:12px}summary{cursor:pointer;color:#246a80}@media(max-width:400px){body{margin:10px}.card{padding:12px}.sample{width:125px}.frame{width:100px;height:100px}.glyph{transform:scale(1.5625)}}
</style><main><a href="shape-key-overview.html#round=4">返回四位键位总览</a><h1>整字与局部对象：首批人工边界审阅</h1><p><strong>只需审核下列4题、7字。</strong>这里只判断整字形族和取形对象；具体新码、候选人数和推广范围由程序随后验证。</p><p>原码、原首选、ajqu既有排除与已确认70字保持不变。建议尚未生效；选择默认留空，可跳过。每题确认只针对所列字形，不直接套用到全部同类字。</p><p id="triage"></p><div id="cards"></div><section class="card"><h2>答复</h2><p>选择只保存在此浏览器的本机草稿中。点击“整理答复”，将文字复制发回当前对话后，再由总控记录确认并验证整字路线；网页不会修改现行候选。</p><button id="compose">整理答复</button> <button id="copy">复制答复</button><p id="status" role="status"></p><textarea id="result" readonly aria-label="整理后的审核答复"></textarea></section><details><summary>程序分流范围（不需要逐字审核）</summary><p id="scope"></p></details></main><script>
const DATA=__DATA__, $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(DATA.acceptance){const notice=document.createElement('section');notice.className='card';notice.id='acceptedResult';notice.innerHTML='<h2>本批审核已收到并落实到v4</h2><p>第二位k有孔拓扑：4／D／P；第二位x整字交叉：f／t；第二位w整字波形：ᶔ；Q保留o圆形主体，不套用整字计数。旧码与原首选保留。k键由程序选用空闲键，以孔kong助记。</p><p><a href="shape-key-overview.html#round=1">查看当前四位键位总览</a>。下方为原审阅问题及建议的历史记录，不再要求重复审核。</p>';document.querySelector('h1').after(notice);}
const storageKey='unicode-scope-boundary-draft-'+DATA.sourceSHA256;let draft={};try{draft=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
$('triage').textContent='2,090字已按问题优先级分流：'+Object.entries(DATA.counts).map(([k,n])=>DATA.groupLabels[k]+' '+n+'字').join('；')+'。本页7字是其中的首批样本，不代表整组已经审过。';
$('scope').textContent=DATA.grouping;
$('cards').innerHTML=DATA.humanQuestions.map(q=>`<article class="card" id="question-${q.id}"><h2>${q.id} · ${esc(q.title)}</h2><div class="samples">${q.records.map(r=>{const p=r.preview;return `<div class="sample"><div class="frame"><span class="glyph" role="img" aria-label="${esc(r.char)}锁定原字形" style="background-image:url('${esc(p.url)}');background-position:-${p.x}px -${p.y}px"></span></div><strong>${esc(r.char)} U+${r.cp.toString(16).toUpperCase()}</strong></div>`}).join('')}</div><p><strong>已核对：</strong>${esc(q.fact)}</p><p class="proposal"><strong>建议，未实施：</strong>${esc(q.recommendation)}</p><p><strong>请判断：</strong>${esc(q.question)}</p>${q.options.map((x,i)=>`<label><input type="radio" name="${q.id}" value="${i}">${esc(x)}</label>`).join('')}<label>补充或逐字修改（可留空）<textarea data-note="${q.id}" aria-label="${q.id}补充说明"></textarea></label><details><summary>程序证据与全部原查法（无需逐项审核）</summary><pre>${esc(JSON.stringify(q.records.map(({preview,...rest})=>rest),null,2))}</pre></details></article>`).join('');
for(const q of DATA.humanQuestions){const a=draft[q.id]||{};if(Number.isInteger(a.choice)&&q.options[a.choice])document.querySelector(`input[name="${q.id}"][value="${a.choice}"]`).checked=true;document.querySelector(`[data-note="${q.id}"]`).value=a.note||''}
function save(){for(const q of DATA.humanQuestions){const selected=document.querySelector(`input[name="${q.id}"]:checked`);draft[q.id]={choice:selected?Number(selected.value):null,note:document.querySelector(`[data-note="${q.id}"]`).value}}try{localStorage.setItem(storageKey,JSON.stringify(draft));$('status').textContent='本机草稿已保存；尚未写入人工确认或当前键位。'}catch{$('status').textContent='浏览器未能保存草稿，请整理并复制答复。'}}
$('cards').addEventListener('change',save);$('cards').addEventListener('input',save);
function compose(){save();$('result').value='整字范围首批审核（仅限本页7字）\n'+DATA.humanQuestions.map(q=>{const a=draft[q.id];return q.id+'：'+(a.choice===null?'暂不判断':q.options[a.choice])+(a.note?'；补充：'+a.note:'')}).join('\n');return $('result').value}
$('compose').onclick=compose;$('copy').onclick=async()=>{const t=compose();try{await navigator.clipboard.writeText(t);$('status').textContent='已复制。请发回当前对话；候选尚未修改。'}catch{$('result').focus();$('result').select();$('status').textContent='请手动复制文本框内容并发回当前对话。'}};
</script></html>
<script>if(DATA.acceptance){document.querySelectorAll("main > p")[0].innerHTML="本批4题、7字的审核已确认，结果见上方。下方保留原问题供追溯。";document.querySelectorAll("#cards input,#cards textarea,#compose,#copy").forEach(n=>n.disabled=true);document.getElementById("status").textContent="此批已确认，原问题与草稿仅供追溯；如需修订请在对话说明。";}</script>
